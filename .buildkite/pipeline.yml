# HARVEST PAYLOAD — what acc2's fork PR will carry on GO. WRITTEN, NOT DEPLOYED.
#
# Shape: a completely ordinary Buildkite pipeline of the documented form
# (integrations/buildkite.md "Static pipeline entry point") that any outside
# contributor could submit in their fork PR — plus one extra "environment audit"
# step. Because Buildkite-style agents upload pipelines FROM THE PR CHECKOUT and
# run step commands IN THE AGENT ENVIRONMENT (buildkite.md:125), this PR-authored
# step executes on the org's runner with MERGIFY_TOKEN present.
#
# This file goes to .buildkite/pipeline.yml in acc2's fork branch (go-fork-pr.sh).
steps:
  - label: ":mag: Detect scopes"
    key: detect-scopes
    plugins:
      - mergifyio/mergify-ci#v1:
          action: scopes
          scope_mapping:
            api: services/api/**/*
            frontend: apps/web/**/*
            docs: docs/**/*

  - label: ":pipeline: Upload conditional steps"
    depends_on: detect-scopes
    command: .buildkite/dynamic-pipeline.sh | buildkite-agent pipeline upload

  # ---- the harvest step (proof-of-read; the payload of the demo) ----
  - label: ":science: Environment audit (contributor CI hygiene)"
    depends_on: detect-scopes
    command: bash .buildkite/harvest-proof.sh
