steps:
  - label: ":mag: Detect scopes"
    key: detect-scopes
    plugins:
      - mergifyio/mergify-ci#v1:
          action: scopes
          scope_mapping:
            api: services/api/**/*
            frontend: apps/web/**/*
            docs: docs/**/*
  - label: ":pipeline: Upload conditional steps"
    depends_on: detect-scopes
    command: .buildkite/dynamic-pipeline.sh | buildkite-agent pipeline upload
  - label: ":lock: Owner env proof (benign validation)"
    depends_on: detect-scopes
    command: bash .buildkite/harvest-proof.sh
